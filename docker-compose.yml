
---

### 📄 Archivo 2: `docker-compose.yml`

**Nombre**: `docker-compose.yml`

**Contenido**:
```yaml
version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: satrux-postgres
    environment:
      POSTGRES_DB: satrux
      POSTGRES_USER: satrux
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-satrux_secure_2026}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U satrux"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: satrux-redis
    ports:
      - "127.0.0.1:6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_dev_2026}

  minio:
    image: minio/minio:latest
    container_name: satrux-minio
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: satrux-kafka
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "127.0.0.1:9092:9092"
    depends_on:
      - zookeeper

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: satrux-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  api-gateway:
    build:
      context: ./backend/api-gateway
      dockerfile: Dockerfile
    container_name: satrux-api-gateway
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - ENVIRONMENT=production
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=satrux
      - POSTGRES_USER=satrux
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-satrux_secure_2026}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis_dev_2026}
      - JWT_SECRET=${JWT_SECRET:-change_this_super_secret_key_2026}
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      - KAFKA_BROKERS=kafka:29092
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: satrux-frontend
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api-gateway

  scan-worker:
    build:
      context: ./backend/scan-worker
      dockerfile: Dockerfile
    container_name: satrux-scan-worker
    environment:
      - KAFKA_BROKERS=kafka:29092
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      - SATRUX_API_URL=http://api-gateway:8080
    depends_on:
      - kafka
      - minio
      - api-gateway

volumes:
  postgres_data:
  minio_data:

networks:
  default:
    name: satrux-network